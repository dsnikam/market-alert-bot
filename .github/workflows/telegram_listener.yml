name: Telegram /fetch Listener

on:
  schedule:
    # Every 5 minutes -- GitHub's practical minimum polling interval.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # needed so this workflow can commit the updated offset.txt

jobs:
  listen:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Check for /fetch command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_listener.py

      - name: Commit updated offset (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add offset.txt
          git diff --staged --quiet || git commit -m "Update Telegram offset [skip ci]"
          git push
